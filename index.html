<!DOCTYPE html>
<html lang="es">

<style>
:root{--bg:#0f172a;--card:#1a2540;--tx:#fff;--mut:#9aa6bf;--pri:#ff6b3d;--ok:#2ecc8f;--bad:#ff6b70;--bd:#26335a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(90px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:6px 0 12px}h2{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
button{font:inherit;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 16px}
button.p{background:var(--pri);color:#1a1208;border-color:var(--pri);font-weight:600}
button.w{width:100%;margin-top:8px}
input,select,textarea{font:inherit;width:100%;min-height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 10px;margin:4px 0 8px}
label{font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.item input{width:26px;min-height:26px;margin:0}
.b{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--bg)}
.b.yo{margin-left:auto;background:var(--pri);color:#fff}
@media print{button,#msgs,a,summary{display:none!important}}
summary::-webkit-details-marker{display:none}
h1,h2,.tt{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:700}
h1{font-size:34px}h2{font-size:24px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);min-height:58px;font-size:14px;padding:0}
nav button.on{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal button{min-height:52px;padding:0;border-radius:10px}
.cal button.on{background:var(--pri);color:#1a1208;border-color:var(--pri)}
.dot{display:block;width:6px;height:6px;border-radius:9px;background:var(--ok);margin:2px auto 0}
.cal button.on .dot{background:#1a1208}
.mot{background:linear-gradient(135deg,#ff6b3d,#ff9a5c);color:#1a1208;font-size:21px;font-weight:600;border:0}
.st{display:flex;align-items:center;gap:10px}.st button{width:52px;border-radius:99px;font-size:26px;padding:0}.st input{text-align:center;font-size:26px}
.mot{min-height:270px;display:flex;align-items:center;font-size:36px;line-height:1.15;padding:28px;border-radius:22px;position:relative;overflow:hidden;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700}
.mot:before{content:"\201C";position:absolute;right:16px;top:-40px;font-size:220px;opacity:.2;font-family:Georgia,serif}
</style>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<main id="app">Cargando…</main>
<script>
var URL_="https://uryxqriklzfdhmynzhht.supabase.co",KEY="sb_publishable_jiDh3Fu3owrftp778jlmvw_TzcuO4rh";
var sb=supabase.createClient(URL_,KEY),ROL=null,V="login",CUR=null,LIST=[],CH=null,MSG="";
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function $(i){return document.getElementById(i)}
function kcal(c){var p=+c.peso,a=+c.altura,e=+c.edad;if(!p||!a||!e)return null;var b=10*p+6.25*a-5*e+(c.sexo==="hombre"?5:-161),d=+c.dias||3,f=d<=2?1.4:d==3?1.5:d==4?1.55:1.65,t=b*f;if(c.obj==="deficit")t*=.8;if(c.obj==="superavit")t*=1.1;return{k:Math.round(t/10)*10,p:Math.round(1.8*p)}}

 var r=await sb.auth.getSession();
 if(!r.data.session){V="login";return draw()}
 var pr=await sb.from("profiles").select("rol").eq("id",r.data.session.user.id).single();
 ROL=pr.data?pr.data.rol:"cliente";
 if(ROL==="coach"){await loadList();V="lista";draw()}else{await loadMine()}}
var LIB=[];

async function loadCur(id){
 var a=await Promise.all([sb.from("clientes").select("*").eq("id",id).single(),sb.from("plan_dias").select("*").eq("cliente_id",id).order("fecha"),sb.from("pesos").select("*").eq("cliente_id",id).order("fecha"),sb.from("adjuntos").select("*").eq("cliente_id",id).order("creado"),sb.from("registros").select("*").eq("cliente_id",id).order("creado"),sb.from("comidas").select("*").eq("cliente_id",id).order("creado")]);
 CUR={c:a[0].data,p:a[1].data||[],w:a[2].data||[],adj:a[3].data||[],reg:a[4].data||[],com:a[5].data||[]}}

 if(!r.data||!r.data.length){CUR=null;V="sinacceso";return draw()}
 await loadCur(r.data[0].id);var w=await sb.from("config").select("*");CFG={};(w.data||[]).forEach(x=>CFG[x.clave]=x.valor);WA=CFG.wa_coach||"";V="cli";draw()}
async function login(nuevo){
 var e=$("em").value.trim(),p=$("pw").value;MSG="";
 var r=nuevo?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});

function vLista(){
 var h='<div class="row"><h1>Mis clientes</h1><button onclick="salir()">Salir</button></div><button class="p w" onclick="go(\'nuevo\')">+ Nuevo cliente</button><button class="w" onclick="go(\'tab\')">⏱ Temporizador Tabata</button>'+cfgH();

 LIST.forEach(function(c){h+='<div class="card" onclick="openC(\''+c.id+'\')"><div class="row"><b>'+esc(c.nombre)+'</b><span class="tag '+(pagoOk(c)?"ok":"bad")+'">'+(pagoOk(c)?"Pagó":"Sin pago")+'</span></div><div class="mut">'+esc(c.objetivo||"Sin objetivo")+'</div></div>'});

function vNuevo(){return '<h1>Nuevo cliente</h1><div class="card"><label>Nombre</label><input id="n"><label>Mail (el que va a usar para entrar)</label><input id="e" type="email"><label>Objetivo</label><input id="o"><button class="p w" onclick="addC()">Guardar</button><button class="w" onclick="go(\'lista\')">Cancelar</button></div>'}

async function openC(id){await loadCur(id);V="det";draw();window.scrollTo(0,0)}
function sel(k,v,o){return '<select onchange="setF(\''+k+'\',this.value)">'+o.map(function(x){return '<option value="'+x[0]+'"'+(x[0]==v?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>'}

function vDet(){
 var c=CUR.c,k=kcal(c),h='<button onclick="loadList().then(function(){go(\'lista\')})">← Clientes</button><h1>'+esc(c.nombre)+'</h1><div class="mut">'+esc(c.email)+'</div>'+(c.telefono?'<a href="https://wa.me/'+String(c.telefono).replace(/\D/g,"")+'" target="_blank"><button class="p w">Escribirle por WhatsApp</button></a>':'<p class="mut">Todavía no cargó su WhatsApp.</p>');
 h+='<div class="card"><div class="row"><b>Pago</b><span class="tag '+(pagoOk(c)?"ok":"bad")+'">'+(pagoOk(c)?"Al día":"Bloqueado")+'</span></div><label>Pagado hasta (opcional)</label><input type="date" value="'+esc(c.vence||"")+'" onchange="setF(\'vence\',this.value||null)"><button class="w '+(c.pagado?"":"p")+'" onclick="setF(\'pagado\','+!c.pagado+')">'+(c.pagado?"Marcar como NO pagó":"Marcar como pagó")+'</button><p class="mut">Si no pagó o venció, el cliente no ve su plan.</p></div>';
 h+=DP("ficha","📋 Datos del cliente",'<div class="card"><b>Ficha</b><div class="g2"><div><label>Sexo</label>'+sel("sexo",c.sexo,[["mujer","Mujer"],["hombre","Hombre"]])+'</div>'+num("edad","Edad",c)+num("peso","Peso (kg)",c)+num("altura","Altura (cm)",c)+num("dias","Días por semana",c)+'<div><label>Objetivo calórico</label>'+sel("obj",c.obj,[["deficit","Déficit"],["mantener","Mantener"],["superavit","Superávit"]])+'</div></div><p>¿Entrenó antes? <b>'+esc(c.entreno||"Sin dato")+'</b></p><label>Lesiones o patologías</label><textarea rows="2" onchange="setF(\'lesiones\',this.value)">'+esc(c.lesiones)+'</textarea>'+(c.lesiones?'<p class="bad">⚠ Revisá las lesiones antes de aprobar el plan.</p>':"")+(k?'<p>Estimación aproximada: <b>'+k.k+' kcal</b> y <b>'+k.p+' g</b> de proteína por día.</p>':'<p class="mut">Completá sexo, edad, peso y altura para ver la estimación.</p>')+'</div>');
 var ph="";CUR.p.forEach(function(d){ph+='<div class="card"><div class="row"><b>'+fmt(d.fecha)+' · '+esc(d.titulo)+'</b><span class="tag '+(d.aprobado?"ok":"mut")+'">'+(d.aprobado?"Aprobado":"Borrador")+'</span></div><div class="mut">'+d.items.map(function(x){return esc(itemTxt(x))}).join(" · ")+'</div><div class="g2"><button onclick="aprobar(\''+d.id+'\','+!d.aprobado+')">'+(d.aprobado?"Pasar a borrador":"Aprobar")+'</button><button onclick="delD(\''+d.id+'\')">Quitar</button></div></div>'});
 h+=DP("plan","🏋 Rutina",ph+armarH())+DP("peso","⚖ Progreso de peso",'<div class="card">'+pesoH()+'</div>')+DP("media","📸 Fotos y videos ("+CUR.adj.length+")",dpMedia())+DP("prog","📈 Progresión",dpProg())+DP("nutri","🍽 Alimentación",dpNutri())+'<button class="w" onclick="delC()">Borrar cliente</button>';
 return h}
async function setF(k,v){var o={};o[k]=v;var r=await sb.from("clientes").update(o).eq("id",CUR.c.id);if(r.error){alert(r.error.message);return}CUR.c[k]=v;draw()}
var BLOQ=["Entrada en calor","Activación","Principal","Core","Vuelta a la calma"],PLANOS=["sagital","frontal","transversal"],DRAFT=[],DF=hoy(),DT="",DB="Principal";
function itemTxt(x){return typeof x==="string"?x:x.nombre+(x.detalle?" — "+x.detalle:"")}
function opts(a,v){return a.map(function(o){return '<option'+(o===v?" selected":"")+'>'+o+'</option>'}).join("")}
function armarH(){
 var ops=LIB.filter(function(e){return e.bloque===DB}),h='<div class="card"><b>Armar día de entrenamiento</b><button class="w" onclick="runPreset()">🏃 Cargar día de running</button><label>Fecha</label><input type="date" value="'+DF+'" onchange="DF=this.value"><label>Título</label><input value="'+esc(DT)+'" onchange="DT=this.value" placeholder="Ej: Tren inferior"><label>Bloque</label><select onchange="DB=this.value;draw()">'+opts(BLOQ,DB)+'</select><label>Ejercicio de tu biblioteca</label><select id="xe"><option value="">— elegir —</option>'+ops.map(function(e){return '<option value="'+e.id+'">'+esc(e.nombre)+'</option>'}).join("")+'</select>'+(ops.length?'':'<p class="mut">No tenés ejercicios en este bloque. Cargalos abajo en la biblioteca.</p>')+'<label>Series y repeticiones</label><input id="xd" placeholder="Ej: 3x12 con 10 kg, o libre / con mancuerna"><button class="w" onclick="addX()">+ Agregar al día</button>';
 DRAFT.forEach(function(x,i){h+='<div class="row mut" style="margin-top:6px"><span>'+esc(x.bloque+": "+itemTxt(x))+'</span><button onclick="DRAFT.splice('+i+',1);draw()">✕</button></div>'});
 return h+'<button class="p w" onclick="addD()">Guardar día como borrador</button></div>'+libH()}
function addX(){var e=LIB.find(function(z){return z.id===$("xe").value});if(!e)return;DRAFT.push({bloque:DB,nombre:e.nombre,detalle:$("xd").value.trim(),video:e.video||"",plano:e.plano||""});draw()}
async function addD(){
 if(!DT.trim()||!DRAFT.length){alert("Poné un título y al menos un ejercicio.");return}
 var r=await sb.from("plan_dias").insert({cliente_id:CUR.c.id,fecha:DF||hoy(),titulo:DT.trim(),items:DRAFT});
 if(r.error){alert(r.error.message);return}
 DRAFT=[];DT="";await loadCur(CUR.c.id);draw()}
function libH(){
 var h='<h2>Mi biblioteca de ejercicios</h2><div class="card"><label>Nombre</label><input id="ln"><div class="g2"><div><label>Bloque</label><select id="lb">'+opts(BLOQ,"Principal")+'</select></div><div><label>Plano del video</label><select id="lp">'+opts(PLANOS,"sagital")+'</select></div></div><label>Link del video (YouTube, Drive, etc.)</label><input id="lv" type="url" placeholder="https://"><button class="p w" onclick="addLib()">Guardar ejercicio</button></div>';
 LIB.forEach(function(e){h+='<div class="row mut" style="margin:6px 0"><span>'+esc(e.bloque+": "+e.nombre)+(e.video?" ▶ "+esc(e.plano||""):"")+'</span><button onclick="delLib(\''+e.id+'\')">✕</button></div>'});
 return h}
async function addLib(){
 var n=$("ln").value.trim();if(!n)return;
 var r=await sb.from("ejercicios").insert({nombre:n,bloque:$("lb").value,plano:$("lp").value,video:$("lv").value.trim()||null});
 if(r.error){alert(r.error.message);return}
 await loadList();draw()}
async function delLib(i){if(!confirm("¿Borrar este ejercicio de la biblioteca?"))return;await sb.from("ejercicios").delete().eq("id",i);await loadList();draw()}
function itemsH(d){
 var h="";
 BLOQ.forEach(function(b){
  var g=d.items.map(function(x,i){return[x,i]}).filter(function(p){return(typeof p[0]==="object"?p[0].bloque:"Principal")===b});
  if(!g.length)return;
  h+='<div class="mut" style="margin-top:10px"><b>'+b+'</b></div>';
  g.forEach(function(p){var x=p[0],i=p[1];
   h+='<label class="item" style="color:var(--tx);font-size:17px"><input type="checkbox" '+(d.hecho[i]?"checked":"")+' onchange="tick(\''+d.id+'\','+i+',this.checked)"><span>'+esc(itemTxt(x))+(x.plano?' <span class="tag mut">'+esc(x.plano)+'</span>':'')+'</span></label>'+(x.video?'<div style="margin:0 0 6px 36px"><button onclick="vid(this,\''+esc(x.video)+'\')">▶ Ver video (plano '+esc(x.plano||"")+')</button><div></div></div>':'')})});
 return h}
function fichaCli(c){
 return '<div class="card"><b>Mis datos</b><p class="mut">Completalos para que tu coach pueda armar tu plan. Una vez guardados no se pueden modificar: revisalos bien.</p><div class="g2"><div><label>Sexo</label><select id="fs">'+opts(["mujer","hombre"],c.sexo)+'</select></div><div><label>Edad</label><input id="fe" type="number" inputmode="numeric" value="'+esc(c.edad)+'"></div><div><label>Peso (kg)</label><input id="fp" type="number" inputmode="decimal" value="'+esc(c.peso)+'"></div><div><label>Altura (cm)</label><input id="fa" type="number" inputmode="numeric" value="'+esc(c.altura)+'"></div><div><label>Días por semana</label><input id="fd" type="number" inputmode="numeric" value="'+esc(c.dias)+'"></div><div><label>Objetivo calórico</label><select id="fo">'+opts(["deficit","mantener","superavit"],c.obj)+'</select></div></div><label>¿Entrenaste antes? Contá hace cuánto y qué hacías (o escribí "nunca")</label><textarea id="fx" rows="2">'+esc(c.entreno)+'</textarea><label>Lesiones o patologías</label><textarea id="fl" rows="2">'+esc(c.lesiones)+'</textarea><label>Tu WhatsApp con código de país (ej: 5491155551234)</label><input id="ft" type="tel" inputmode="numeric" value="'+esc(c.telefono)+'"><button class="p w" onclick="guardarFicha()">Guardar mis datos</button></div>'}
async function guardarFicha(){if(!confirm("Una vez guardados no vas a poder modificarlos. ¿Guardar?"))return;
 var n=function(i){var v=parseFloat($(i).value);return isNaN(v)?null:v};
 var r=await sb.rpc("guardar_mi_ficha",{p_sexo:$("fs").value,p_edad:n("fe"),p_peso:n("fp"),p_altura:n("fa"),p_dias:n("fd"),p_obj:$("fo").value,p_lesiones:$("fl").value,p_entreno:$("fx").value,p_tel:$("ft").value.trim()});

 if(w.length){var d=(w[w.length-1].kg-w[0].kg).toFixed(1);h+='<p><b>'+w[w.length-1].kg+' kg</b> · cambio desde el inicio: '+(d>0?"+":"")+d+' kg</p>';w.slice(-5).reverse().forEach(function(p){h+='<div class="mut">'+fmt(p.fecha)+': '+p.kg+' kg</div>'})}

async function loadMsgs(){
 var r=await sb.from("mensajes").select("*").eq("cliente_id",CUR.c.id).order("creado"),me=ROL==="coach"?"coach":"cliente",b=$("msgs");if(!b)return;
 b.innerHTML=(r.data||[]).map(function(m){return '<div class="b'+(m.de===me?" yo":"")+'">'+esc(m.texto)+'</div>'}).join("")||'<p class="mut">Todavía no hay mensajes.</p>';b.scrollTop=b.scrollHeight}
